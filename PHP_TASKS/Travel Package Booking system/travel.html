<!DOCTYPE html>
<html>
<head>
    <title>Travel Package Booking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>Travel Package Booking</h2>

<form action="booking.php" method="POST">

<label>Customer Name</label>
<input type="text" name="name" required>

<label>Mobile Number</label>
<input type="text" name="mobile" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Select Travel Package</label>
<select name="package" required>
    <option value="">-- Select Package --</option>
    <option value="Ooty Tour">Ooty Tour - ₹5,000</option>
    <option value="Kodaikanal Tour">Kodaikanal Tour - ₹6,500</option>
    <option value="Goa Tour">Goa Tour - ₹12,000</option>
    <option value="Kerala Tour">Kerala Tour - ₹15,000</option>
</select>

<label>Number of Persons</label>
<input type="number" name="persons" min="1" required>

<input type="submit" value="Book Now">

</form>

</div>

</body>
</html>
