<!DOCTYPE html>
<html>
<head>
    <title>Mobile Bill Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>Mobile Bill Generator</h2>

<form action="mobilebill.php" method="POST">

<label>Customer Name</label>
<input type="text" name="name" required>

<label>Mobile Number</label>
<input type="text" name="mobile" required>

<label>Select Tariff Plan</label>
<select name="plan" required>
    <option value="">Select Plan</option>
    <option value="Basic">Basic</option>
    <option value="Standard">Standard</option>
    <option value="Premium">Premium</option>
</select>

<label>Extra Call Minutes</label>
<input type="number" name="minutes" min="0" required>

<input type="submit" value="Generate Bill">

</form>

</div>

</body>
</html>
